name: Проверка OrderFlow
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    name: Тесты / ${{ matrix.database }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgresql]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: orderflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d orderflow_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Установить зависимости
        run: python -m pip install -c constraints.txt -e '.[dev]'
      - name: Проверить стиль
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Проверить JavaScript
        run: |
          node --check src/orderflow/static/app.js
          node --test tests/time.test.mjs
      - name: Тесты SQLite
        if: matrix.database == 'sqlite'
        run: python -m pytest -q
      - name: Тесты PostgreSQL
        if: matrix.database == 'postgresql'
        env:
          ORDERFLOW_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/orderflow_test
        run: python -m pytest -q
      - name: Проверить самостоятельный SQL-измеритель
        if: matrix.database == 'postgresql'
        env:
          ORDERFLOW_QUERY_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/orderflow_test
        run: python scripts/query_plans.py --output artifacts/query-plan-smoke --rows 1000 --repeats 1 --comparison all
  compose-smoke:
    name: Запуск Docker Compose
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ciOnlySyntheticPassword8472
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Собрать и запустить учебное окружение
        run: docker compose up -d --build
      - name: Проверить живое приложение и права
        run: python scripts/smoke_http.py
      - name: Показать диагностику при ошибке
        if: failure()
        run: docker compose logs --no-color
      - name: Остановить временное окружение runner
        if: always()
        run: docker compose down --volumes --remove-orphans
